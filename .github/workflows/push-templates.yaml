name: Push Coder Templates

on:
  push:
    branches: [main]
    paths:
      - "templates/**"
  workflow_dispatch:

jobs:
  detect-templates:
    runs-on: ubuntu-latest
    outputs:
      templates: ${{ steps.find.outputs.templates }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: find
        run: |
          # Check if we are in a Push event to determine the range
          if [ "${{ github.event_name }}" == "push" ]; then
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.event.after }}"
          else
            # Manual dispatch or other event (e.g. schedule) - push all templates
            echo "Manual trigger or unknown event. Pushing all templates."
            TEMPLATES=$(find templates -maxdepth 2 -name "main.tf" -printf '%h\n' | \
              sed 's|templates/||' | \
              jq -R -s -c 'split("\n") | map(select(length > 0))')
            echo "templates=$TEMPLATES" >> "$GITHUB_OUTPUT"
            echo "Found templates: $TEMPLATES"
            exit 0
          fi

          # Fetch depth to ensure we have history for diff
          git fetch --depth=100 origin +refs/heads/main:refs/remotes/origin/main

          # Get changed files
          # Handle force push or new branch creation where before sha might be 0s
          if [ "$BASE_SHA" == "0000000000000000000000000000000000000000" ]; then
              # Look back 1 commit if new branch
              CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
          else
              CHANGED_FILES=$(git diff --name-only $BASE_SHA $HEAD_SHA)
          fi

          # Filter for template directories
          # Sort and unique to avoid duplicates
          TEMPLATES=$(echo "$CHANGED_FILES" | grep '^templates/' | cut -d/ -f2 | sort | uniq | jq -R -s -c 'split("\n") | map(select(length > 0))')

          # Fallback to empty array if no templates changed, to avoid JSON errors
          if [ -z "$TEMPLATES" ] || [ "$TEMPLATES" == "[]" ]; then
              echo "No templates changed."
              echo "templates=[]" >> "$GITHUB_OUTPUT"
          else
              echo "templates=$TEMPLATES" >> "$GITHUB_OUTPUT"
              echo "Found changed templates: $TEMPLATES"
          fi

  push-templates:
    needs: detect-templates
    runs-on: ubuntu-latest
    strategy:
      matrix:
        template: ${{ fromJson(needs.detect-templates.outputs.templates) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Coder CLI
        uses: coder/setup-action@v1
        with:
          access_url: ${{ vars.CODER_URL }}
          coder_session_token: ${{ secrets.CODER_SESSION_TOKEN }}

      - name: Push and Update ${{ matrix.template }} template
        run: |
          # Push the template (creates/updates version)
          coder templates push ${{ matrix.template }} \
            -d ./templates/${{ matrix.template }} \
            --variable namespace=${{ vars.CODER_NAMESPACE }} \
            --variable gemini_api_key=${{ secrets.GEMINI_API_KEY }} \
            --variable gemini_base_url=${{ vars.GEMINI_BASE_URL }} \
            --yes \
            --message "auto: ${{ github.sha }}"
            
          # Extract metadata from README.md frontmatter
          README="./templates/${{ matrix.template }}/README.md"
          if [ -f "$README" ]; then
            # Parse values and strip potential surrounding quotes
            DISPLAY_NAME=$(grep "^display_name:" "$README" | sed 's/^display_name: *//' | sed 's/^"//;s/"$//' | tr -d '\r')
            DESCRIPTION=$(grep "^description:" "$README" | sed 's/^description: *//' | sed 's/^"//;s/"$//' | tr -d '\r')
            ICON=$(grep "^icon:" "$README" | sed 's/^icon: *//' | sed 's/^"//;s/"$//' | tr -d '\r')
            
            # Construct edit arguments
            ARGS=""
            if [ ! -z "$DISPLAY_NAME" ]; then ARGS="$ARGS --display-name \"$DISPLAY_NAME\""; fi
            if [ ! -z "$DESCRIPTION" ]; then ARGS="$ARGS --description \"$DESCRIPTION\""; fi
            if [ ! -z "$ICON" ]; then ARGS="$ARGS --icon \"$ICON\""; fi
            
            # Update template metadata if args exist
            if [ ! -z "$ARGS" ]; then
              echo "Updating metadata for ${{ matrix.template }}..."
              # Use eval to handle quoted arguments correctly
              eval "coder templates edit ${{ matrix.template }} $ARGS --yes"
            fi
          fi
