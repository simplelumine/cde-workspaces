# Create a namespace for the Coder workspaces (if it doesn't already exist)
# For the kubernetes-sre template, this is usually "coder" or similar.
# You can change "sre-workspaces" to whatever namespace your Coder template uses.
# The `namespace` variable in kubernetes-sre/main.tf determines where workspaces are created.
# Assuming you deploy workspaces into the `sre-workspaces` namespace for this example.

apiVersion: v1
kind: Namespace
metadata:
  name: sre-workspaces
---
# 1. Create the ServiceAccount for SRE Workspaces
apiVersion: v1
kind: ServiceAccount
metadata:
  name: coder-sre-sa
  namespace: sre-workspaces
---
# 2. Grant Cluster-wide Admin permissions to this SA
# Since you are the SRE testing this out, a ClusterRole is appropriate
# for managing the entire cluster from your workspace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: coder-sre-cluster-admin
subjects:
  - kind: ServiceAccount
    name: coder-sre-sa
    namespace: sre-workspaces
roleRef:
  kind: ClusterRole
  name: cluster-admin # Built-in cluster-admin role
  apiGroup: rbac.authorization.k8s.io
